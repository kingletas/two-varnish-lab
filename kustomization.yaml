apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
resources:
  - 00-namespace.yaml
  - 02-origin.yaml
  - 03-origin-service.yaml
  - 04-varnish.yaml
  - 05-varnish-service.yaml
  - 08-varnish-pods-service.yaml
  - 09-router.yaml
  - 10-router-service.yaml
  - 11-disruption-budgets.yaml
configMapGenerator:
  - name: origin-code
    files:
      - server.py
  - name: varnish-vcl
    files:
      - default.vcl
  - name: router-config
    files:
      - haproxy.cfg
