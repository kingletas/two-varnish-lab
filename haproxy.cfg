global
    maxconn 1000
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option redispatch
    retries 3
    retry-on conn-failure empty-response
    timeout connect 500ms
    timeout client 30s
    timeout server 30s

resolvers cluster
    parse-resolv-conf
    hold valid 5s
    timeout resolve 1s
    timeout retry 1s

frontend web
    bind :8080
    monitor-uri /healthz
    monitor fail if { nbsrv(caches) lt 1 }
    default_backend caches

backend caches
    balance uri
    hash-type consistent
    option httpchk GET /healthz
    default-server check inter 2s fall 3 rise 2 resolvers cluster resolve-prefer ipv4 init-addr none
    server varnish-0 "varnish-0.varnish-pods.${POD_NAMESPACE}.svc.cluster.local:8080"
    server varnish-1 "varnish-1.varnish-pods.${POD_NAMESPACE}.svc.cluster.local:8080"

listen stats
    bind :8404
    stats enable
    stats uri /
